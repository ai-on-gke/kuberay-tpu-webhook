apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: tpu7x-ds-multislice-2x2x2
  labels:
    kueue.x-k8s.io/queue-name: lq
spec:
  headGroupSpec:
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-head
          image: rayproject/ray:nightly-py312-tpu
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "1"
              memory: "4Gi"
  workerGroupSpecs:
  - replicas: 2
    minReplicas: 2
    maxReplicas: 2
    groupName: tpu-worker-group
    numOfHosts: 2
    rayStartParams: {}
    template:
      metadata:
        annotations:
          cloud.google.com/gke-tpu-slice-topology: 2x2x2
      spec:
        containers:
        - name: ray-worker
          image: rayproject/ray:nightly-py312-tpu
          env:
          - name: MEGASCALE_NUM_SLICES
            value: "2"
          resources:
            requests:
              google.com/tpu: "4"
            limits:
              google.com/tpu: "4"
        tolerations:
        - key: "google.com/tpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
        nodeSelector:
          cloud.google.com/gke-tpu-accelerator: tpu7x
