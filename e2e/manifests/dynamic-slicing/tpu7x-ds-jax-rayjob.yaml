apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: tpu7x-ds-jax-rayjob
  labels:
    kueue.x-k8s.io/queue-name: lq
spec:
  shutdownAfterJobFinishes: true
  entrypoint: python /app/jax_trainer.py
  runtimeEnvYAML: |
    env_vars:
      ACCELERATOR_TYPE: "TPU-V7X"
      TOPOLOGY: "2x2x2"
      NUM_WORKERS: "2"
      RESOURCES_PER_WORKER: "4"
  rayClusterSpec:
    headGroupSpec:
      rayStartParams: {}
      template:
        spec:
          containers:
          - name: ray-head
            image: rayproject/ray:nightly-py312-tpu
            volumeMounts:
            - name: script-vol
              mountPath: /app
            resources:
              requests:
                cpu: "1"
                memory: "4Gi"
              limits:
                cpu: "1"
                memory: "4Gi"
          volumes:
          - name: script-vol
            configMap:
              name: rayjob-ds-script
    workerGroupSpecs:
    - replicas: 1
      minReplicas: 1
      maxReplicas: 1
      groupName: tpu-worker-group
      numOfHosts: 2
      rayStartParams: {}
      template:
        metadata:
          annotations:
            cloud.google.com/gke-tpu-slice-topology: 2x2x2
        spec:
          containers:
          - name: ray-worker
            image: rayproject/ray:nightly-py312-tpu
            securityContext:
              privileged: true
            resources:
              requests:
                google.com/tpu: "4"
              limits:
                google.com/tpu: "4"
          tolerations:
          - key: "google.com/tpu"
            operator: "Equal"
            value: "present"
            effect: "NoSchedule"
          nodeSelector:
            cloud.google.com/gke-tpu-accelerator: tpu7x
