apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: tpu7x-jax-train-rayjob
spec:
  entrypoint: python /app/jax_trainer.py
  runtimeEnvYAML: |
    env_vars:
      ACCELERATOR_TYPE: "TPU-V7X"
      TOPOLOGY: "2x2x1"
      NUM_WORKERS: "1"
      RESOURCES_PER_WORKER: "4"
  rayClusterSpec:

    headGroupSpec:
      rayStartParams: {}
      template:
        spec:
          containers:
          - name: ray-head
            image: rayproject/ray:nightly-py312-tpu
            volumeMounts:
            - name: script-vol
              mountPath: /app
            resources:
              requests:
                cpu: "1"
              limits:
                cpu: "1"
          volumes:
          - name: script-vol
            configMap:
              name: rayjob-script
    workerGroupSpecs:
    - replicas: 1
      minReplicas: 1
      maxReplicas: 1
      groupName: tpu-worker-group
      numOfHosts: 1
      rayStartParams: {}
      template:
        spec:
          containers:
          - name: ray-worker
            image: rayproject/ray:nightly-py312-tpu
            securityContext:
              privileged: true
            resources:
              requests:
                google.com/tpu: "4"
              limits:
                google.com/tpu: "4"
          nodeSelector:
            cloud.google.com/gke-tpu-accelerator: tpu7x
            cloud.google.com/gke-tpu-topology: 2x2x1
